function study(a, i) {

i === 1

:
i === 2
?
'"Sede santos, porque eu sou santo." — 1 Pedro 1:16'
:
'"Permanecei em mim, e eu permanecerei em vós." — João 15:4';


let h = `

<article class="study">

<div class="num">
Estudo 0${i}
</div>

<h3>
${a[0]}
</h3>

<div class="bible">
${quote}
</div>

<p>
${a[1]}
</p>

<p>
${a[2]}
</p>

`;


for (
let j = 3;
j < a.length - 1;
j += 3
) {

h += `

<h4>
${a[j]}
</h4>

<p>
${a[j + 1]}
</p>

<p>
${a[j + 2]}
</p>

`;

}


h += `

<div class="bible">
${a[a.length - 1]}
</div>

</article>

`;

return h;

}
